<style>
/* Layout: a dispatch-style desk. Sticky masthead with edition switcher, tab bar, then product sections as ruled ledgers; prices as a mono table. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#13232C; --muted:#56666F; --rule:#CBD5DA;
  --accent:#0A5A86; --accent-soft:#DCEBF3; --lead-bg:#123A4D; --lead-fg:#F2F7FA; --ok:#1B7A4B; --warn:#A8620A; --bad:#B3302B;
  --display:'Source Serif 4',Georgia,serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A20; --surface:#16252D; --ink:#E3EBEF; --muted:#93A5AF; --rule:#2B3E48;
  --accent:#6BB8E0; --accent-soft:#1B3442; --lead-bg:#0B2A38; --lead-fg:#E3EBEF; --ok:#5FCB92; --warn:#E5A04D; --bad:#F08A84; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A20; --surface:#16252D; --ink:#E3EBEF; --muted:#93A5AF; --rule:#2B3E48;
  --accent:#6BB8E0; --accent-soft:#1B3442; --lead-bg:#0B2A38; --lead-fg:#E3EBEF; --ok:#5FCB92; --warn:#E5A04D; --bad:#F08A84; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.mast{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-block:12px 8px}
h1{font-family:var(--display);font-size:1.5rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ed{display:flex;gap:6px;align-items:center}
.ed button,.ed select{font:inherit;font-family:var(--mono);font-size:.8rem;background:var(--bg);color:var(--ink);border:1px solid var(--rule);padding:6px 10px;border-radius:4px;cursor:pointer}
.ed button:disabled{opacity:.4;cursor:default}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:22px 48px}
h2{font-family:var(--display);font-size:1.3rem;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-size:1.1rem;margin:0}
.lede{color:var(--muted);margin:0 0 18px;max-width:68ch}
.banner{background:var(--accent-soft);border-radius:4px;padding:12px 14px;margin-bottom:22px;max-width:76ch}
.banner strong{font-weight:600}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.toc a{font-family:var(--mono);font-size:.75rem;text-decoration:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:4px 9px;border-radius:3px}
.toc a:hover{border-color:var(--accent)}
.prod{background:var(--surface);border:1px solid var(--rule);border-radius:6px;margin-bottom:18px;scroll-margin-top:130px}
.prod>.hd{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:baseline;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.px{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.px b{color:var(--ink);font-weight:500}
.so{padding:10px 16px;font-size:.9rem;background:var(--accent-soft);border-bottom:1px solid var(--rule)}
.so span{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-right:8px}
ol.items{list-style:none;margin:0;padding:0}
ol.items li{padding:12px 16px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr;gap:4px;min-width:0}
ol.items li:last-child{border-bottom:0}
.t{font-weight:600;text-wrap:pretty}
.n{color:var(--muted);font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:.72rem;color:var(--muted);align-items:center}
.pill{border:1px solid currentColor;border-radius:99px;padding:0 8px;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
.pill.x{color:var(--ok)} .pill.s{color:var(--warn)} .pill.c{color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.na{color:var(--muted);font-style:italic}
tr:last-child td{border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;min-width:0}
.card h3{margin-bottom:6px}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.big{font-family:var(--mono);font-size:1.7rem;font-weight:500;color:var(--accent);line-height:1.1;margin-bottom:6px}
ul.plain{margin:6px 0 0;padding-left:18px} ul.plain li{margin-bottom:4px}
.list-ed{display:grid;gap:8px}
.list-ed a.row{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.list-ed a.row:hover{border-color:var(--accent)}
.cov td:not(:first-child){text-align:center;font-family:var(--mono)}
h4{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:14px 0 4px;font-weight:500}
.lead{background:var(--lead-bg);color:var(--lead-fg);border-radius:6px;padding:18px 20px;margin-bottom:18px}
.lead .eb{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.lead h3{color:inherit;margin:8px 0 10px}
.lead p{margin:0 0 10px;max-width:72ch}
.lens{background:var(--accent-soft);border-radius:6px;padding:12px 16px;margin-bottom:22px;font-size:.9rem;max-width:90ch}
.mg{display:flex;flex-direction:column;gap:2px}
.mg h3{margin:8px 0 0}
.mg p{margin:0;color:var(--ink);font-size:.92rem}
.chk{background:var(--bg);border-radius:4px;padding:2px 12px 10px;margin-top:12px}
.lnk{font:inherit;font-size:.85rem;background:none;border:0;color:var(--accent);padding:10px 0 0;cursor:pointer;text-align:left;text-decoration:underline}
.sect{margin:30px 0 12px}
.eb2{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
details.tl{background:var(--surface);border:1px solid var(--rule);border-radius:6px;margin-bottom:10px}
details.tl summary{cursor:pointer;padding:12px 16px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between}
details.tl summary span{font-weight:400;font-size:.8rem;color:var(--muted)}
details.tl ol{list-style:none;margin:0;padding:0 16px 8px 18px;border-left:3px solid var(--accent);margin-left:16px}
details.tl li{padding:8px 0 10px}
details.tl time{font-family:var(--mono);font-size:.72rem;color:var(--accent);display:block}
details.tl li p{margin:2px 0 4px}
.tlnext{background:var(--bg);margin:6px 16px 14px;border-radius:4px;padding:6px 12px 10px}
.tlnext p{margin:0}
td small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.ev a{display:block;margin-top:4px}
footer{border-top:1px solid var(--rule);padding-block:16px 28px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.prod{transition:border-color .15s}}
</style>

s claim Ras Tanura strike; Saudi confirmation absent", "n": "Reuters reported a Houthi claim of a ballistic missile attack on the Ras Tanura refinery complex on 27 October. Saudi authorities had not confirmed the attack in that report; separate reporting described a contained fire near the terminal.", "w": "Potential processing and export risk at a major complex. A claimed strike, a nearby fire and a quantified refinery outage are not equivalent; no production loss is assumed.", "src": "Reuters", "u": "https://www.streetinsider.com/Reuters/Yemens%2BHouthis%2Bsay%2Bthey%2Blaunched%2Ban%2Battack%2Bon%2BSaudi%2BRas%2BTanura%2Boil%2Brefinery/27236697.html", "d": "27 Oct 2026, 07:29 EDT", "c": "s"}]}, {"k": "gasolinenaphtha", "name": "Gasoline & naphtha", "so": "Refinery and export signals for light products.", "items": [{"id": "kuwait-naphtha-27", "t": "KPC offers 35,000 tonnes of naphtha for Asian delivery", "n": "Reporting citing a tender document reviewed by Reuters described 35,000 tonnes of full-range naphtha, loading 16–30 November. Bids were due 29 October, with delivered terms at an Asian destination.", "w": "A potential feedstock-supply option rather than a confirmed sale. Delivered terms incorporate shipping into the offer, while award price and execution still require verification.", "src": "Egypt Oil & Gas, citing Reuters tender reporting", "u": "https://egyptoil-gas.com/news/kuwait-offers-35000-tons-of-naphtha-for-november-delivery-to-asia/", "d": "27 Oct 2026; exact publication time unspecified", "c": "s"}]}, {"k": "bunkers", "name": "Bunkers", "so": "Core to Golden Island's physical supply in Singapore.", "items": [{"id": "sg-bunkers-27", "t": "Singapore bunker availability stays tight in dated update", "n": "ENGINE’s 27 October 17:00 SGT update reported earliest VLSFO lead times of about 13 days, with some suppliers recommending over three weeks. LSMGO needed 9–11 days, while Port Klang prompt supply remained constrained.", "w": "Potential relevance to b time Executive published satellite-based evidence on 28 October of damage to a processing unit and terminal tank farm. Analysts interpreted reduced flaring as possible curtailment. Reuters had not obtained immediate Saudi confirmation of the 27 October strike claim. The refinery normally processes up to 550,000 b/d; that capacity is not a verified production loss.", "w": "Potential relevance: refinery and loading disruption could tighten multiple products and alter Asian sourcing. Treat damage evidence, inferred shutdown and confirmed export losses as separate questions.", "src": "The Maritime Executive; cross-checked against Reuters", "u": "https://maritime-executive.com/article/strike-damage-confirmed-at-giant-saudi-refinery-complex", "d": "28 Oct 2026, 23:25 publisher timestamp; timezone not stated", "c": "x"}, {"id": "us-inventories", "t": "US crude stocks fall unexpectedly; product balances diverge", "n": "EIA reported a 1.9 million barrel commercial crude draw to 410.6 million barrels for the week ended 23 October. Gasoline stocks rose 3.9 million barrels while distillates fell 1.5 million. The figures were released on 28 October and corroborated by Reuters.", "w": "The crude draw supports prompt supply concerns, but the gasoline build warns against treating all products as equally tight. US export and refining changes can alter Atlantic-to-Asia cargo economics.", "src": "EIA; corroborated by Reuters", "u": "https://ir.eia.gov/wpsr/summary.txt", "d": "28 Oct 2026", "c": "x"}]}, {"k": "gasolinenaphtha", "name": "Gasoline & naphtha", "so": "Refinery and export signals for light products.", "items": [{"id": "china-export-quotas", "t": "China issues another fuel export quota batch, Reuters sources say", "n": "Reuters reported a fourth allocation for gasoline, diesel and jet fuel on 28 October, bringing the annual total in line with 2025. Its headline puts the batch at nearly four million tonnes; the full standalone report is access-restricted, but the event is corroborated in accessible Reuters market reporting. No official allocation document was retrieved.", "w": "Additional export permission could increase Asian product availability, including supplies competing with Singapore cargoes. Quotas permit exports; they do not prove cargoes have loaded.", "src": "Reuters", "u": "https://www.marketscreener.com/news/china-issues-nearly-4-million-tons-of-fuel-export-quotas-in-fourth-batch-for-2026-sources-say-ce785cd2df8ff121", "d": "28 Oct 2026", "c": "x"}]}, {"k": "dieseljetfuel", "name": "Diesel & jet fuel", "so": "Distillate supply and the gasoil link to MGO.", "items": [{"id": "diesel-quality-analysis", "t": "Fresh analysis warns diesel scarcity also raises marine-fuel quality questions", "n": "Integr8’s 28 October analysis, republished by Manifold Times on 29 October, argues diesel/gasoil tightness could persist into winter and 2027. This is a forecast, not a new outage. EIA’s latest week independently shows distillate stocks down 1.5 million barrels and 10% below the five-year average.", "w": "Potential relevance: changing refinery streams and trade flows warrant checking specifications, samples and documentation alongside price. No Golden Island off-spec delivery or claim is reported.", "src": "Integr8 Fuels; EIA corroborates inventory tightness", "u": "https://integr8fuels.com/diesel-tightness-puts-oil-and-bunker-prices-under-pressure/", "d": "28 Oct 2026 original; 29 Oct trade republication; original clock unavailable", "c": "x"}]}, {"k": "bunkers", "name": "Bunkers", "so": "Core to Golden Island's physical supply in Singapore.", "items": [{"id": "mpa-emergency-guidelines", "t": "MPA-led group develops alternative-fuel emergency protocols", "n": "Manifold Times reported on 29 October that MPA had updated port authorities on emergency guidelines under development. The Port Authorities Roundtable took place in Perth on 21–23 October; MPA communicated the update on 28 October. Port-to-port vessel data specifications were also discussed.", "w": "Potential relevance for Golden Island as supplier and vessel owner: track final response procedures and assess crew and emergency-interface readiness when issued. This is development work, not a newly effective Singapore rule.", "src": "Manifold Times, attributing MPA", "u": "https://www.manifoldtimes.com/news/mpa-led-work-group-advances-emergency-guidelines-for-alternative-bunker-fuels/", "d": "29 Oct 2026; underlying MPA update 28 Oct; meeting 21–23 Oct", "c": "s"}, {"id": "europe-africa-bunker-slots", "t": "Prompt bunker slots remain tight across Europe and Africa", "n": "ENGINE’s 28 October outlook, published by Manifold Times on 29 October, recommends 5–7 days in ARA and 7–10 days at Gibraltar Strait ports. Some Algeciras suppliers were 4–12 hours late; Dakar availability was very tight. These are market-source indications, not guaranteed slots.", "w": "Potential relevance: voyage planning and customer enquiries should allow for delivery uncertainty. Lower fuel prices or rising aggregate inventories do not guarantee prompt, grade-specific supply.", "src": "ENGINE via Manifold Times", "u": "https://www.manifoldtimes.com/news/engine-europe-africa-bunker-fuel-availability-outlook-28-oct-2026/", "d": "29 Oct 2026 publication; underlying outlook 28 Oct", "c": "s"}, {"id": "djibouti-vlsfo-restart", "t": "Red Sea Bunkering says VLSFO supply has resumed in Djibouti", "n": "ENGINE reported on 29 October that Red Sea Bunkering resumed VLSFO offers this week alongside LSMGO at Djibouti ports and Inner Anchorage. The supplier did not disclose the reason for its earlier interruption. It also reported adding bunker barge Redsea III. Exact restart and barge entry dates were not supplied.", "w": "Potential relevance: another bunker option may support vessels serving the Red Sea corridor. Supplier statements do not establish stem size, delivery guarantees or safe routing; obtain current confirmation.", "src": "ENGINE, directly quoting Red Sea Bunkering", "u": "https://www.engine.online/news/red-sea-bunkering-restarts-vlsfo-supply-in-djibouti-835e", "d": "29 Oct 2026; restart described as this week", "c": "s"}]}, {"k": "lpg", "name": "LPG", "so": "Asia supply and freight for gas carriers.", "items": [{"id": "petronet-propane-procurement", "t": "Petronet plans one-million-tonne annual propane procurement", "n": "Hydrocarbon Processing reported on 28 October that Petronet’s CEO plans initial bids by March for about 1 million tonnes/year from mid-2028 for the Dahej petrochemical project. US supply is an option alongside Middle Eastern producers. The 750,000-tonne/year plant is targeted for 2027–28 commissioning.", "w": "Potential relevance: future Indian feedstock demand and sourcing diversification could reshape LPG shipping and Asian competition. These are procurement and commissioning plans, not an awarded contract or present demand increment.", "src": "Hydrocarbon Processing, reporting CEO remarks", "u": "https://hydrocarbonprocessing.com/news/2026/10/petronet-lng-seeking-propane-bids-by-march-for-750-000-tpy-dahej-petrochemical-unit/", "d": "28 Oct 2026, 12:00 publisher time; timezone not stated", "c": "s"}]}, {"k": "gaslng", "name": "Gas & LNG", "so": "Winter competition for cargoes and LNG bunker context.", "items": [{"id": "shell-q3-results", "t": "Shell reports stronger earnings while Gulf outages remain a constraint", "n": "Shell’s 29 October results release reports $10.8 billion adjusted earnings and $3.037 billion from Integrated Gas. It attributes the gas earnings improvement over Q2 to higher gas and LNG prices. The release cites the completed ARC acquisition and LNG Canada Phase 2 investment; those earlier events are context, not new decisions today.", "w": "Higher earnings can coexist with disrupted physical supply. Potential Asian relevance is producer resilience and LNG portfolio development; quarterly earnings do not establish extra cargo availability this winter.", "src": "Shell company release distributed via Trivano; WSJ corroborates earnings", "u": "https://www.trivano.com/persbericht/shell-plc-publishes-third-quarter-2026-press-release-771336.html", "d": "29 Oct 2026", "c": "x"}, {"id": "phmsa-lng-proposal", "t": "US proposes updated LNG facility safety standards", "n": "PHMSA’s 28 October announcement proposes incorporating NFPA 59A’s 2026 edition and enabling technologies such as membrane tanks and pipe-in-pipe systems. The department estimates $100 million/year savings. Reuters separately reported the proposal. It has not become a final rule.", "w": "Potential relevance: modernised requirements could affect future LNG development costs and execution. The savings are an agency estimate; the proposal adds no immediate cargo supply and is not a blanket export authorisation.", "src": "US PHMSA; Reuters cross-check", "u": "https://www.phmsa.dot.gov/news/trumps-transportation-secretary-sean-p-duffy-modernizes-lng-regulations-secure-american-energy", "d": "28 Oct 2026; publication clock not supplied", "c": "x"}, {"id": "singapore-indonesia-energy-dialogue", "t": "Singapore–Indonesia talks seek implementation of high-level commitments", "n": "In his 28 October Jakarta wrap-up, Foreign Minister Balakrishnan described high-level political commitment and constructive approaches being implemented after meeting President Prabowo. The transcript addresses questions about gas cuts and stresses diversified supplies and reserves. No restored gas volume or restoration date was announced.", "w": "Potential Singapore relevance: monitor actual contracted flows and contingency LNG, rather than equate diplomatic assurances with restored deliveries. No power interruption or Golden Island exposure is established.", "src": "Singapore MFA; 29 Oct Straits Times report via Asia News Network", "u": "https://www.mfa.gov.sg/newsroom/press-statements-transcripts-and-photos/transcript-of-wrap-up-interview-with-singapore-media-by-minister-for-foreign-affairs-dr-vivian-balakrishnan-in-jakarta--indonesia--on-28-october-2026/", "d": "28 Oct 2026 official transcript; 29 Oct follow-up reporting", "c": "x"}]}], "watchNext": ["Ras Tanura operator status and export confirmation — Timing unconfirmed", "MPA-led alternative-fuel emergency guideline publication — Timing unconfirmed", "Europe/Africa bunker slot and Djibouti supplier updates — Next operational confirmation; timing unconfirmed", "China quota conversion into actual product loadings — Timing unconfirmed", "Singapore–Indonesia gas-flow and contingency updates — Timing unconfirmed", "PHMSA LNG proposed-rule consultation — Final rule timing unconfirmed", "OPEC+ meeting — 1 Nov 2026, expected Sunday meeting per Reuters 28 Oct; clock unconfirmed"], "changes": null, "mgmt": {"summary": "Operational reliability remains the main management issue even as Singapore bunker indications fall. Newly reviewed satellite reporting suggests Ras Tanura damage, but neither full refinery capacity loss nor cargo cancellations are established. Treat potential supply consequences as a watch item, not a quantified shortage. European and African delivery windows remain constrained, while Djibouti’s supplier reports VLSFO has returned. For Golden Island as bunker supplier and vessel owner, potential relevance is checking actual grade, delivery window, quality documentation and voyage contingency before making commitments. MPA-led emergency protocol work is new to this edition but remains in development, with no new effective rule date. Diesel tightness is supported by EIA inventories; Integr8’s expectation of persistence into 2027 is a forecast. China’s export permissions may help supply, but do not prove loadings. No fresh verified Golden Island-specific mention was found in checked sources. Company context: https://www.golden-island.com.sg/about and https://www.golden-island.com.sg/news. Vessel ownership and charter-out capability are user-confirmed; private fleet employment and exposures are unknown.", "priorities": [{"sid": ore", "n": "-1.00 on the day, day range 1,238 to 1,325 across sources. Latest trading day before this edition."}], "sections": [{"k": "crudeoil", "name": "Crude oil", "so": "Sets the cost base for every grade.", "items": [{"id": "hormuz-security", "t": "Oman evacuates tanker crew as Gulf attacks escalate", "n": "Oman reported rescuing 25 crew from a burning tanker on 30 October. Maritime Executive also described a limpet-mine incident; Reuters attributed the small-boat explosive attack report to UKMTO. AP could not verify Iran’s separate claims of four mined tankers. Incident totals, responsibility and links between reports remain uncertain.", "w": "Potential relevance: delayed transits, insurance and crew-safety requirements can constrain Gulf oil flows and Asian supply. Do not equate attack claims with confirmed lost barrels.", "src": "Maritime Executive; cross-checked with Reuters and AP", "u": "https://maritime-executive.com/article/oman-evacuates-tanker-crew-as-iran-claims-spate-of-new-attacks", "d": "30 Oct 2026", "c": "x"}, {"id": "libya-hamada-pipeline", "t": "Armed closure interrupts Libya’s Hamada–Zawiya pipeline", "n": "NOC said a forced valve closure caused a pressure surge and pumping stopped at 00:30 on 30 October. It warned about 15,000 b/d of crude intended for Zawiya would be lost while the closure continues. Reuters corroborated the statement; reopening was not verified.", "w": "This threatens refinery feedstock and domestic fuel availability. It does not establish that the whole 120,000-b/d refinery has shut. Mediterranean replacement demand is a potential consequence.", "src": "Libya NOC; cross-checked with Reuters", "u": "https://noc.ly/en/noc-statement-on-the-closure-of-the-main-crude-oil-pipeline-valve-connecting-hamada-field-to-zawiya-refinery/", "d": "30 Oct 2026", "c": "x"}, {"id": "us-august-supply-demand", "t": "New EIA release shows higher August output but softer US oil demand", "n": "Reuters reported the 30 October EIA monthly release: August crude output rose 19,000 b/d from revised July to 13.965 million b/d, while total petroleum demand was 20.595 million b/d, down 2.9% year-on-year. These are August observations newly released, not current October flows.", "w": "The release adds a supply counterweight to geopolitical shortages and cautions against assuming high prices mean uniformly strong consumption.", "src": "Reuters via BOE Report", "u": "https://boereport.com/2026/10/30/us-crude-output-rose-in-august-while-petroleum-demand-declined-eia-says/amp/", "d": "30 Oct 2026", "c": "s"}]}, {"k": "gasolinenaphtha", "name": "Gasoline & naphtha", "so": "Refinery and export signals for light products.", "items": [{"id": "asia-feedstock-flows", "t": "China export quotas and LPG disruptions shift Asian product incentives", "n": "Sparta’s 30 October analysis of 23–29 October says China’s fourth export-quota batch weighed on gasoline premiums, while Indonesian tenders and cracker naphtha buying supported demand. It attributes stronger propane FEI to US LPG terminal disruptions. These are reported market observations; quota execution and outage restoration were not independently confirmed.", "w": "More Chinese gasoline exports could ease regional tightness; costlier LPG can encourage crackers to use naphtha. Singapore traders should watch actual cargo liftings, not infer supply from quota announcements.", "src": "Sparta Commodities", "u": "https://www.spartacommodities.com/market-outlook/asia-gasoline-naphtha-update/", "d": "30 Oct 2026, 09:49; publisher timezone unspecified", "c": "c"}, {"id": "chevron-refinery-record", "t": "Chevron reports record US refinery throughput", "n": "Chevron’s 30 October results put third-quarter US crude inputs at 1.093 million b/d, up 3% year-on-year, with utilization near 98%. Refined-product sales were broadly flat year-on-year. This is a quarterly operating disclosure, not a new daily restart.", "w": "Strong refinery runs help meet product demand, but little unused capacity can leave the system sensitive to outages. US results do not establish Singapore refinery conditions.", "src": "Chevron quarterly results", "u": "https://chevroncorp.gcs-web.com/node/38811", "d": "30 Oct 2026", "c": "s"}]}, {"k": "dieseljetfuel", "name": "Diesel & jet fuel", "so": "Distillate supply and the gasoil link to MGO.", "items": [{"id": "russian-diesel-quotas", "t": "Novak raises November export plan but warns refinery attacks may cut it", "n": "On 30 October Novak told reporters Russia plans 2.15 million tonnes of diesel exports in November versus 510,000 tonnes in October. TASS also reported a draft ban extension through January 2027 with exceptions, and his claim that three refineries and a gas-chemical plant were targeted. Damage and export effects remain unverified; the decree is still a draft.", "w": "This updates yesterday’s approximately 2-million-tonne November estimate and year-end ban report. Actual exemptions, refinery recovery and accepted cargoes determine whether extra diesel reaches global markets.", "src": "TASS reporting Novak; export plan cross-checked with Reuters", "u": "https://tass.com/economy/2211147", "d": "30 Oct 2026", "c": "c"}, {"id": "imperial-refining-results", "t": "Imperial’s results show product tightness boosting refining earnings", "n": "Imperial reported third-quarter downstream earnings of C$1.56 billion versus C$444 million a year earlier, according to Reuters on 30 October. The report linked stronger margins to disrupted fuel supplies and a more favourable product mix. It did not identify a fresh refinery outage.", "w": "Refining earnings provide evidence of the strain between crude and finished-fuel markets. They do not demonstrate Golden Island’s margins or predict its procurement costs.", "src": "Reuters via BOE Report", "u": "https://boereport.com/2026/10/30/imperial-oil-beats-profit-estimates-on-stronger-refining-margins/amp/", "d": "30 Oct 2026", "c": "s"}]}, {"k": "bunkers", "name": "Bunkers", "so": "Core to 0 on the day, day range 1,250 to 1,335 across sources. Latest trading day before this edition."}], "sections": [{"k": "crudeoil", "name": "Crude oil", "so": "Sets the cost base for every grade.", "items": [{"id": "opec-december-consensus", "t": "OPEC+ formally confirms unchanged December targets", "n": "The seven participating countries met on 1 November and decided to retain September required production levels for December, OPEC’s statement confirms. The next meeting is 29 November. Reuters corroborates the decision. This replaces yesterday’s source-reported in-principle agreement with an official outcome.", "w": "Potential relevance: policy uncertainty has narrowed, but unchanged quotas do not ensure unchanged cargo supply where conflict constrains output and exports.", "src": "OPEC; cross-checked with Reuters", "u": "https://www.opec.org/pr-detail/620-1-november-2026.html", "d": "1 Nov 2026; official statement, publication clock not supplied", "c": "x"}, {"id": "hormuz-offshore-tug", "t": "Offshore tug reportedly hit in Strait of Hormuz", "n": "Maritime Executive reports a projectile hit an offshore tug after 15:00 UTC on 1 November, citing UKMTO. Vanguard Tech identified Selat Storm and reported partial sinking; crew status was not given. The UKMTO public page exposed no incident records during this check, so the detailed incident account could not be independently read there.", "w": "Potential relevance: risks extend to support vessels as well as tankers and can complicate oil logistics. Vessel identity, damage and casualty details remain attributed reporting; no perpetrator or lost supply volume is asserted.", "src": "The Maritime Executive, citing UKMTO and Vanguard Tech", "u": "https://maritime-executive.com/article/offshore-tug-hit-in-latest-attack-in-strait-of-hormuz", "d": "1 Nov 2026, 17:48 publisher clock; incident after 15:00 UTC", "c": "s"}, {"id": "brent-3nov", "t": "Brent swings about $5.6 on 3 Nov: high near $107.1, a flash drop to about $101.5, back near $104.3 by the end of the chart", "n": "Intraday chart supplied by the user, 102.94 at 4:00 PM. The benchmark contract and time zone are not labelled on the chart. Reported triggers were remarks on an Iran deal (drop) and reported US strikes at Qeshm Island (rebound).", "w": "Price risk is two-way and headline-driven. A confirmed Hormuz reopening would pull crude and bunker prices down quickly; a failed deal does the opposite.", "src": "Intraday chart supplied by user; Oilprice", "u": "https://oilprice.com/Latest-Energy-News/World-News/Brent-Flash-Crashes-6-Before-Rebounding-Towards-104.html", "d": "3 Nov 2026", "c": "x"}, {"id": "hormuz-3nov", "t": "UKMTO reports two more Hormuz incidents on 3 Nov: an Indian dhow struck and a tanker's engine room hit by two projectiles", "n": "Omani Royal Navy rescued the dhow's surviving crew. No casualties or pollution reported on the tanker. Outlets differ on whether the tanker strike was Sunday or Tuesday. Attribution is unconfirmed.", "w": "War-risk cover, routing and delivery timing for vessels near the strait. No Golden Island exposure is assumed.", "src": "Maritime Executive; Democrata", "u": "https://maritime-executive.com/article/offshore-tug-hit-in-latest-attack-in-strait-of-hormuz", "d": "3 Nov 2026", "c": "c"}, {"id": "iran-4nov", "t": "Iran says a \"maximum deterrence\" plan is ready for any new US attack; deal hopes played down after fresh US strikes", "n": "Coverage from the eve of the US midterms. Trump reportedly hinted at future strikes on Pickaxe Mountain.", "w": "Lowers the odds of a quick Hormuz reopening and keeps crude and bunker prices event-driven.", "src": "Al Jazeera; CBS News", "u": "https://aljazeera.com/news/liveblog/2026/11/4/iran-war-live-tehran-prepares-maximum-deterrence-plan-for-any-new-attack", "d": "4 Nov 2026", "c": "s"}, {"id": "irgc-4nov-mines", "t": "IRGC claims four tankers hit mines in the southern Hormuz channel on 4 Nov; UKMTO confirms only one incident (Grit, 3 Nov)", "n": "The IRGC Navy says two tankers are ablaze and two turned back, and that it downed a US MQ-9. UKMTO confirmed only the Grit strike (two projectiles, about 14 NM NE of Lima, Oman, late 3 Nov). CENTCOM says the channels are mine-free. No independent verification of most claims. No oil price move is reported in the source.", "w": "Escalation risk for war-risk cover, routing and delivery timing near Hormuz. Unverified claims should not drive pricing decisions. No Golden Island exposure is assumed.", "src": "The Maritime Executive, citing IRGC, UKMTO, Vanguard Tech", "u": "https://maritime-executive.com/article/iran-claims-strikes-on-multiple-tankers-emboldened-after-us-elections", "d": "4 Nov 2026, 14:45 publisher clock", "c": "c"}]}, {"k": "gasolinenaphtha", "name": "Gasoline & naphtha", "so": "Refinery and export signals for light products.", "items": [{"id": "kstovo-refinery-risk", "t": "Kstovo industrial damage raises fresh refinery-supply concerns", "n": "AFP reported on 1 November that the regional governor acknowledged significant damage at an industrial enterprise in Kstovo. Ukrainian reports identify the NORSI refinery; that plant identification and unit-level outage were not confirmed in the governor’s statement. Independent trade coverage also flags the verification gap.", "w": "A confirmed refinery curtailment could affect gasoline and distillate supply, but fire footage or nameplate capacity cannot establish barrels lost. This is new attack reporting, not proof that earlier export forecasts have failed.", "src": "AFP via Arab News; cross-checked with bne IntelliNews and trade coverage", "u": "https://www.arabnews.com/world/russia-says-drone-hit-industrial-enterprise-near-moscow-kyiv-claims-hit-major-refinery-3009214", "d": "1 Nov 2026, 09:17 publisher display; timezone not supplied", "c": "x"}]}, {"k": "dieseljetfuel", "name": "Diesel & jet fuel", "so": "Distillate supply and the gasoil link to MGO.", "items": [{"id": "go-30oct", "t": "Singapore gasoil ended 30
