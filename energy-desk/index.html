<style>

:root{

}

  --bg:#0F1A20; --surface:#16252D; --ink:#E3EBEF; --muted:#93A5AF; --rule:#2B3E48;

:root[data-theme="dark"]{

*{box-sizing:border-box}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.mast{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-block:12px 8px}
h1{font-family:var(--display);font-size:1.5rem;margin:0;letter-spacing:-.01em;text-wrap:balance}

.ed{display:flex;gap:6px;align-items:center}
.ed button,.ed select{font:inherit;font-family:var(--mono);font-size:.8rem;background:var(--bg);color:var(--ink);border:1px solid var(--rule);padding:6px 10px;border-radius:4px;cursor:pointer}
.ed button:disabled{opacity:.4;cursor:default}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap}

main{padding-block:22px 48px}

h3{font-family:var(--display);font-size:1.1rem;margin:0}
.lede{color:var(--muted);margin:0 0 18px;max-width:68ch}
.banner{background:var(--accent-soft);border-radius:4px;padding:12px 14px;margin-bottom:22px;max-width:76ch}
.banner strong{font-weight:600}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.toc a{font-family:var(--mono);font-size:.75rem;text-decoration:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:4px 9px;border-radius:3px}
.toc a:hover{border-color:var(--accent)}
.prod{background:var(--surface);border:1px solid var(--rule);border-radius:6px;margin-bottom:18px;scroll-margin-top:130px}
.prod>.hd{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:baseline;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.px{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.px b{color:var(--ink);font-weight:500}
.so{padding:10px 16px;font-size:.9rem;background:var(--accent-soft);border-bottom:1px solid var(--rule)}
.so span{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-right:8px}
ol.items{list-style:none;margin:0;padding:0}
ol.items li{padding:12px 16px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr;gap:4px;min-width:0}
ol.items li:last-child{border-bottom:0}
.t{font-weight:600;text-wrap:pretty}
.n{color:var(--muted);font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:.72rem;color:var(--muted);align-items:center}
.pill{border:1px solid currentColor;border-radius:99px;padding:0 8px;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
.pill.x{color:var(--ok)} .pill.s{color:var(--warn)} .pill.c{color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.na{color:var(--muted);font-style:italic}
tr:last-child td{border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;min-width:0}
.card h3{margin-bottom:6px}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.big{font-family:var(--mono);font-size:1.7rem;font-weight:500;color:var(--accent);line-height:1.1;margin-bottom:6px}
ul.plain{margin:6px 0 0;padding-left:18px} ul.plain li{margin-bottom:4px}
.list-ed{display:grid;gap:8px}
.list-ed a.row{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.list-ed a.row:hover{border-color:var(--accent)}
.cov td:not(:first-child){text-align:center;font-family:var(--mono)}
footer{border-top:1px solid var(--rule);padding-block:16px 28px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.prod{transition:border-color .15s}}

ar availability was very tight. These are market-source indications, not guaranteed slots.", "w": "Potential relevance: voyage planning and customer enquiries should allow for delivery uncertainty. Lower fuel prices or rising aggregate inventories do not guarantee prompt, grade-specific supply.", "src": "ENGINE via Manifold Times", "u": "https://www.manifoldtimes.com/news/engine-europe-africa-bunker-fuel-availability-outlook-28-oct-2026/", "d": "29 Oct 2026 publication; underlying outlook 28 Oct", "c": "s"}, {"id": "djibouti-vlsfo-restart", "t": "Red Sea Bunkering says VLSFO supply has resumed in Djibouti", "n": "ENGINE reported on 29 October that Red Sea Bunkering resumed VLSFO offers this week alongside LSMGO at Djibouti ports and Inner Anchorage. The supplier did not disclose the reason for its earlier interruption. It also reported adding bunker barge Redsea III. Exact restart and barge entry dates were not supplied.", "w": "Potential relevance: another bunker option may support vessels serving the Red Sea corridor. Supplier statements do not establish stem size, delivery guarantees or safe routing; obtain current confirmation.", "src": "ENGINE, directly quoting Red Sea Bunkering", "u": "https://www.engine.online/news/red-sea-bunkering-restarts-vlsfo-supply-in-djibouti-835e", "d": "29 Oct 2026; restart described as this week", "c": "s"}]}, {"k": "lpg", "name": "LPG", "so": "Asia supply and freight for gas carriers.", "items": [{"id": "petronet-propane-procurement", "t": "Petronet plans one-million-tonne annual propane procurement", "n": "Hydrocarbon Processing reported on 28 October that Petronet’s CEO plans initial bids by March for about 1 million tonnes/year from mid-2028 for the Dahej petrochemical project. US supply is an option alongside Middle Eastern producers. The 750,000-tonne/year plant is targeted for 2027–28 commissioning.", "w": "Potential relevance: future Indian feedstock demand and sourcing diversification could reshape LPG shipping and Asian co  15,000 b/d of crude intended for Zawiya would be lost while the closure continues. Reuters corroborated the statement; reopening was not verified.", "w": "This threatens refinery feedstock and domestic fuel availability. It does not establish that the whole 120,000-b/d refinery has shut. Mediterranean replacement demand is a potential consequence.", "src": "Libya NOC; cross-checked with Reuters", "u": "https://noc.ly/en/noc-statement-on-the-closure-of-the-main-crude-oil-pipeline-valve-connecting-hamada-field-to-zawiya-refinery/", "d": "30 Oct 2026", "c": "x"}, {"id": "us-august-supply-demand", "t": "New EIA release shows higher August output but softer US oil demand", "n": "Reuters reported the 30 October EIA monthly release: August crude output rose 19,000 b/d from revised July to 13.965 million b/d, while total petroleum demand was 20.595 million b/d, down 2.9% year-on-year. These are August observations newly released, not current October flows.", "w": "The release adds a supply counterweight to geopolitical shortages and cautions against assuming high prices mean uniformly strong consumption.", "src": "Reuters via BOE Report", "u": "https://boereport.com/2026/10/30/us-crude-output-rose-in-august-while-petroleum-demand-declined-eia-says/amp/", "d": "30 Oct 2026", "c": "s"}]}, {"k": "gasolinenaphtha", "name": "Gasoline & naphtha", "so": "Refinery and export signals for light products.", "items": [{"id": "asia-feedstock-flows", "t": "China export quotas and LPG disruptions shift Asian product incentives", "n": "Sparta’s 30 October analysis of 23–29 October says China’s fourth export-quota batch weighed on gasoline premiums, while Indonesian tenders and cracker naphtha buying supported demand. It attributes stronger propane FEI to US LPG terminal disruptions. These are reported market observations; quota execution and outage restoration were not independently confirmed.", "w": "More Chinese gasoline exports could ease regional tightness; costlier LPG can encourage crackers to use naphtha. Singapore traders should watch actual cargo liftings, not infer supply from quota announcements.", "src": "Sparta Commodities", "u": "https://www.spartacommodities.com/market-outlook/asia-gasoline-naphtha-update/", "d": "30 Oct 2026, 09:49; publisher timezone unspecified", "c": "c"}, {"id": "chevron-refinery-record", "t": "Chevron reports record US refinery throughput", "n": "Chevron’s 30 October results put third-quarter US crude inputs at 1.093 million b/d, up 3% year-on-year, with utilization near 98%. Refined-product sales were broadly flat year-on-year. This is a quarterly operating disclosure, not a new daily restart.", "w": "Strong refinery runs help meet product demand, but little unused capacity can leave the system sensitive to outages. US results do not establish Singapore refinery conditions.", "src": "Chevron quarterly results", "u": "https://chevroncorp.gcs-web.com/node/38811", "d": "30 Oct 2026", "c": "s"}]}, {"k": "dieseljetfuel", "name": "Diesel & jet fuel", "so": "Distillate supply and the gasoil link to MGO.", "items": [{"id": "russian-diesel-quotas", "t": "Novak raises November export plan but warns refinery attacks may cut it", "n": "On 30 October Novak told reporters Russia plans 2.15 million tonnes of diesel exports in November versus 510,000 tonnes in October. TASS also reported a draft ban extension through January 2027 with exceptions, and his claim that three refineries and a gas-chemical plant were targeted. Damage and export effects remain unverified; the decree is still a draft.", "w": "This updates yesterday’s approximately 2-million-tonne November estimate and year-end ban report. Actual exemptions, refinery recovery and accepted cargoes determine whether extra diesel reaches global markets.", "src": "TASS reporting Novak; export plan cross-checked with Reuters", "u": "https://tass.com/economy/2211147", "d": "30 Oct 2026", "c": "c"}, {"id": "imperial-refining-results", "t": "Imperial’s results show product tightness boosting refining earnings", "n": "Imperial reported third-quarter downstream earnings of C$1.56 billion versus C$444 million a year earlier, according to Reuters on 30 October. The report linked stronger margins to disrupted fuel supplies and a more favourable product mix. It did not identify a fresh refinery outage.", "w": "Refining earnings provide evidence of the strain between crude and finished-fuel markets. They do not demonstrate Golden Island’s margins or predict its procurement costs.", "src": "Reuters via BOE Report", "u": "https://boereport.com/2026/10/30/imperial-oil-beats-profit-estimates-on-stronger-refining-margins/amp/", "d": "30 Oct 2026", "c": "s"}]}, {"k": "bunkers", "name": "Bunkers", "so": "Core to Golden Island's physical supply in Singapore.", "items": [{"id": "singapore-bunker-slots", "t": "Singapore bunker supply stays tight; VLSFO lead times start near 13 days", "n": "ENGINE’s 30 October update reports constrained fuel-oil inventories. Indicative VLSFO lead times start near 13 days, with some suppliers recommending over three weeks; HSFO needs about 10 days to three weeks and LSMGO 9–11 days. HSFO is almost unchanged week-on-week; ranges differ by supplier.", "w": "Potential relevance: delivery reliability and nomination lead time may matter as much as headline price. Indicative ranges are not firm slots, and no conclusion is drawn about Golden Island’s own availability.", "src": "ENGINE", "u": "https://www.engine.online/news/east-of-suez-market-update-30-oct-8375", "d": "30 Oct 2026, 17:00 SGT observation", "c": "s"}]}, {"k": "lpg", "name": "LPG", "so": "Asia supply and freight for gas carriers.", "items": [{"id": "november-lpg-osps", "t": "November LPG contract references rise materially", "n": "Reuters reports traders said Aramco raised November propane and butane OSPs by $40/t and $50/t to $720/t and $780/t. Sonatrach raised propane by $155/t to $825/t and butane by $300/t to $1,050/t. These are monthly contract settings, not daily spot assessments.", "w": "This material reset affects contract-linked Asian and Mediterranean procurement. Seasonal demand and constrained supply were the reported drivers; landed costs also depend on freight and contractual terms.", "src": "Reuters via ZAWYA", "u": "https://www.zawya.com/en/business/saudi-aramco-and-sonatrach-raise-lpg-official-selling-prices-for-november-sources-say-1857782", "d": "30 Oct 2026, 11:33 UTC", "c": "s"}]}, {"k": "gaslng", "name": "Gas & LNG", "so": "Winter competition for cargoes and LNG bunker context.", "items": [{"id": "exxon-lng-stakes", "t": "Exxon discloses larger planned Papua and Rovuma LNG stakes", "n": "Exxon’s 30 October results say it agreed to increase interests in Papua LNG to 34% and Rovuma LNG to 50%. Papua operatorship is older context: PNG’s prime minister dated the formal handover to 16 October. The new results do not establish first cargoes or immediate new liquefaction supply.", "w": "Potential relevance: changes in project sponsorship can influence execution and future Asia-facing LNG supply. Financing, approvals and construction milestones remain more useful than treating ownership news as operating capacity.", "src": "ExxonMobil results; PNG government date cross-check", "u": "https://investor.exxonmobil.com/sec-filings/all-sec-filings/content/0002115436-26-000018/livef8k3q26991.htm", "d": "30 Oct 2026", "c": "x"}]}], "watchNext": ["Verified Gulf incident updates, navigational advice and actual tanker movements; timing unconfirmed.", "Russian diesel decree, final exemptions and executed November loadings; draft is not final policy.", "Singapore supplier-specific delivery slots and grade availability before relying on indicative lead times.", "Brent January becomes the active reference after December expiry; reset comparisons rather than show a false price fall.", "Implementation of November LPG monthly settings and Asia-bound freight; do not confuse monthly and daily changes.", "Papua/Rovuma LNG execution m urement and customer discussions therefore need the right grade, quote basis and delivery window rather than a crude-only view. November LPG OSPs are a material monthly reset, not a daily rally.\n\nPotential relevance follows Golden Island’s public bunkering and ship-management activities (https://www.golden-island.com.sg/about; https://www.golden-island.com.sg/news) and user-confirmed vessel ownership. No private exposures or fleet schedules are known. No new verified Golden Island mention was found in the sources checked; the 17 October ethanol operation remains dated context. Traders should continue using licensed systems for executable prices; this brief supplies market context and suggested checks.", "priorities": [{"t": "Singapore bunker supply stays tight; VLSFO lead times start near 13 days", "status": "New", "change": "New-to-desk verified Singapore observations dated 30 Oct; yesterday’s management snapshot lacked verified local lead times. This is not proof that conditions deteriorated overnight.", "why": "Potential relevance: early nominations and realistic delivery windows for bunker supply; no inference about company commitments.", "check": "Compare any upcoming Singapore requirements with supplier-confirmed grade, volume, slot and contingency arrangements."}, {"t": "Oman evacuates tanker crew as Gulf attacks escalate", "status": "Updated", "change": "Fresh 30 Oct crew evacuation and reported limpet attack add evidence beyond yesterday’s broad diplomatic/security risk. Iran’s wider incident claims remain unverified.", "why": "Potential relevance: vessel-owner crew safety, transit conditions and bunker cargo scheduling, only where the company has actual exposure.", "check": "Check whether any actual planned voyages or supply routes require updated security advice, insurer terms and contingency review."}, {"t": "Novak raises November export plan but warns refinery attacks may cut it", "status": "Updated", "change": "Novak’s 30 Oct plan is 2.15 million ton n levels for December, OPEC’s statement confirms. The next meeting is 29 November. Reuters corroborates the decision. This replaces yesterday’s source-reported in-principle agreement with an official outcome.", "w": "Potential relevance: policy uncertainty has narrowed, but unchanged quotas do not ensure unchanged cargo supply where conflict constrains output and exports.", "src": "OPEC; cross-checked with Reuters", "u": "https://www.opec.org/pr-detail/620-1-november-2026.html", "d": "1 Nov 2026; official statement, publication clock not supplied", "c": "x"}, {"id": "hormuz-offshore-tug", "t": "Offshore tug reportedly hit in Strait of Hormuz", "n": "Maritime Executive reports a projectile hit an offshore tug after 15:00 UTC on 1 November, citing UKMTO. Vanguard Tech identified Selat Storm and reported partial sinking; crew status was not given. The UKMTO public page exposed no incident records during this check, so the detailed incident account could not be independently read there.", "w": "Potential relevance: risks extend to support vessels as well as tankers and can complicate oil logistics. Vessel identity, damage and casualty details remain attributed reporting; no perpetrator or lost supply volume is asserted.", "src": "The Maritime Executive, citing UKMTO and Vanguard Tech", "u": "https://maritime-executive.com/article/offshore-tug-hit-in-latest-attack-in-strait-of-hormuz", "d": "1 Nov 2026, 17:48 publisher clock; incident after 15:00 UTC", "c": "s"}]}, {"k": "gasolinenaphtha", "name": "Gasoline & naphtha", "so": "Refinery and export signals for light products.", "items": [{"id": "kstovo-refinery-risk", "t": "Kstovo industrial damage raises fresh refinery-supply concerns", "n": "AFP reported on 1 November that the regional governor acknowledged significant damage at an industrial enterprise in Kstovo. Ukrainian reports identify the NORSI refinery; that plant identification and unit-level outage were not confirmed in the governor’s statement. Independent trade }
function viewEdition(e){
  var toc=e.sections.map(function(s){return '<a href="#" data-sec="'+s.k+'">'+s.name+'</a>'}).join("");
  var secs=e.sections.map(function(s){
    return '<section class="prod" id="sec-'+s.k+'"><div class="hd"><h3>'+s.name+'</h3>'+(s.px?'<div class="px">'+s.px+'</div>':'')+'</div>'+(s.so?'<div class="so"><span>So what</span>'+s.so+'</div>':'')+'<ol class="items">'+s.items.map(itemHTML).join("")+'</ol></section>';
  }).join("");
  var wn=(e.watchNext&&e.watchNext.length)?'<div class="card" style="margin-bottom:22px"><h3>Watch next</h3><ul class="plain">'+e.watchNext.map(function(w){return '<li>'+w+'</li>'}).join('')+'</ul></div>':'';
  return '<h2>'+e.label+'</h2><p class="lede"><strong>'+e.headline+'</strong>'+(e.pulse?' '+e.pulse:'')+'</p>'+
   '<div class="banner"><strong>Coverage note.</strong> '+e.coverage+' Where fewer than five relevant items exist, everything relevant is shown.</div>'+
   '<div class="toc">'+toc+'</div>'+wn+secs;
}
function viewPrices(e){
  var rows=e.prices.map(function(p){
    return '<tr><td>'+p.p+'</td>'+(p.v?'<td class="num">'+p.v+'</td><td class="num">'+p.d+'</td><td><a href="'+p.u+'" target="_blank" rel="noopener">'+p.s+'</a></td>':'<td class="na" colspan="3">Not available</td>')+'<td>'+p.n+'</td></tr>';
  }).join("");
  return '<h2>Prices</h2><p class="lede">Latest figures found in public reporting for '+e.label+'. Dates differ by row. S&amp;P Global Platts assessments are paywalled, so the figures here come from open sources. The S&amp;P LPG podcast is the only S&amp;P item included.</p><div class="tablewrap"><table><thead><tr><th>Product</th><th>Level</th><th>As of</th><th>Source</th><th>Note</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function viewChanges(){
  var e=ed(),prev=EDITIONS[state.ed-1];
  if(e.changes&&e.changes.items){
    return '<h2>What changed</h2><p class="lede">'+e.label+', compared with saved edition '+e.changes.comparedWith+'.</p><div class="list-ed">'+e.changes.items.map(function(i){return '<div class="row card"><span><span class="pill x">'+i.status+'</span><br>'+i.text+'</span></div>'}).join('')+'</div><p class="n" style="margin-top:14px;max-width:76ch">'+e.changes.limitations+'</p>';
  }
  if(!prev||!prev.sections.length){
    var n=itemsOf(e).length;
    return '<h2>What changed</h2><p class="lede">'+e.label+' has no saved comparison with an earlier day, so nothing is inferred.</p><div class="grid"><div class="card"><div class="big">'+n+'</div><h3>Items published</h3><p>Across '+e.sections.length+' sections.</p></div><div class="card"><div class="big">'+itemsOf(e).filter(function(i){return i.c==="x"}).length+'</div><h3>Cross-checked</h3><p>Confirmed by two or more sources.</p></div><div class="card"><div class="big">'+itemsOf(e).filter(function(i){return i.c==="c"}).length+'</div><h3>Flagged</h3><p>Conflicting figures or weak sourcing.</p></div></div>';
  }
  var pi={};itemsOf(prev).forEach(function(i){pi[i.id]=1});
  var ci={};itemsOf(e).forEach(function(i){ci[i.id]=1});
  var added=itemsOf(e).filter(function(i){return !pi[i.id]}),dropped=itemsOf(prev).filter(function(i){return !ci[i.id]});
  var pp={};prev.prices.forEach(function(p){pp[p.p]=p.v});
  var moved=e.prices.filter(function(p){return p.v&&pp[p.p]&&pp[p.p]!==p.v});
  function li(a,f){return a.length?'<ul class="plain">'+a.map(f).join("")+'</ul>':'<p>None.</p>'}
  return '<h2>What changed</h2><p class="lede">'+e.label+' compared with '+prev.label+'.</p><div class="grid"><div class="card"><h3>New items ('+added.length+')</h3>'+li(added,function(i){return '<li>'+i.t+'</li>'})+'</div><div class="card"><h3>Dropped ('+dropped.length+')</h3>'+li(dropped,function(i){return '<li>'+i.t+'</li>'})+'</div><div class="card"><h3>Price moves ('+moved.length+')</h3>'+li(moved,function(p){return '<li>'+p.p+': '+pp[p.p]+' → '+p.v+'</li>'})+'</div></div>';
}
function viewArchive(){
  var r=EDITIONS.map(function(e,i){return {e:e,i:i}}).reverse().map(function(o){
    return '<a class="row" href="#ed-'+o.e.date+'"><span><strong>'+o.e.label+'</strong><br><span class="n">'+o.e.headline+'</span></span><span class="px">'+itemsOf(o.e).length+' items'+(o.e.baseline?' · baseline':'')+'</span></a>';
  }).join("");
  return '<h2>Edition archive</h2><p class="lede">Every daily edition is kept. Select one to read it as published, or use the arrows at the top to step between days.</p><div class="list-ed">'+r+'</div>';
}
function viewBrief(){
  var e=EDITIONS[EDITIONS.length-1],all=itemsOf(e),srcs={};
  var mg=null;for(var q=EDITIONS.length-1;q>=0;q--){if(EDITIONS[q].mgmt){mg=EDITIONS[q];break}}
  function mgHTML(){
    if(!mg)return '';var m=mg.mgmt;
    var pr=m.priorities.map(function(p){return '<div class="card"><span class="pill s">'+p.status+'</span><h3 style="margin-top:6px">'+p.t+'</h3><p><strong>What changed.</strong> '+p.change+'</p><p><strong>Why it matters to Golden Island.</strong> '+p.why+'</p><p><strong>Suggested check.</strong> '+p.check+'</p></div>'}).join('');
    var wl=m.watchlist.map(function(w){return '<li><strong>'+w.event+'</strong> ('+w.date+'). '+w.significance+'</li>'}).join('');
    var cn=m.companyNews?'<div class="card" style="margin-bottom:22px"><h3>Golden Island in the news</h3><p>'+m.companyNews.summary+'</p>'+m.companyNews.items.map(function(i){return '<p style="margin-top:8px"><strong>'+i.title+'</strong>. '+i.text+' <a href="'+i.url+'" target="_blank" rel="noopener">'+i.source+'</a> · '+i.date+'</p>'}).join('')+'</div>':'';
    return '<h3 style="margin:0 0 8px">Two-minute view · '+mg.label+'</h3><p class="lede">'+m.summary.split('\n\n').join('</p><p class="lede">')+'</p><div class="grid">'+pr+'</div><div class="card" style="margin-bottom:22px"><h3>Management watchlist</h3><ul class="plain">'+wl+'</ul></div>'+cn+'<p class="n" style="max-width:76ch;margin:0 0 28px">'+m.limitations+'</p>';
  }
  all.forEach(function(i){i.src.split(";").forEach(function(s){srcs[s.trim()]=1})});
  var nsrc=Object.keys(srcs).length;
  var covRows=e.sections.map(function(s){
    var x=s.items.filter(function(i){return i.c==="x"}).length;
    return '<tr><td>'+s.name+'</td><td>'+s.items.length+'</td><td>'+x+'</td></tr>';
  }).join("");
  return '<h2>Management brief</h2>'+mgHTML()+'<h3 style="margin:0 0 8px">Why rely on this desk</h3><p class="lede">Why this desk is faster and safer than reading each site and newspaper separately. Reference site: <a href="https://sherry-energy-desk.golden-islan-7474.chatgpt.site/" target="_blank" rel="noopener">sherry-energy-desk.golden-islan-7474.chatgpt.site</a>.</p>'+
  '<div class="grid"><div class="card"><div class="big">1 page</div><h3>Instead of '+nsrc+' sources</h3><p>The latest edition draws on '+nsrc+' distinct outlets and data providers, including Ship &amp; Bunker, Engine, Maritime Executive, Manifold Times, QCIntel, S&amp;P Global and Argus.</p></div>'+
  '<div class="card"><div class="big">'+e.sections.length+' sections</div><h3>Every grade in one view</h3><p>Crude, bunkers, LPG and LNG from the daily desk, plus biofuels, methanol, ethanol, ammonia, gasoil and IMO regulation from added research.</p></div>'+
  '<div class="card"><div class="big">3 labels</div><h3>Fact-check on every item</h3><p>Each story is marked cross-checked, single source, or conflicting. Disagreeing sources are shown side by side, not averaged away.</p></div></div>'+
  '<div class="card" style="margin-bottom:22px"><h3>Where the edge comes from</h3><ul class="plain"><li><strong>Dated and cited.</strong> Every figure shows its date and links to its source, so stale numbers are visible.</li><li><strong>Gaps are stated.</strong> If a price or story is missing, the desk says so instead of filling it.</li><li><strong>Change tracking.</strong> The What changed tab shows new items, dropped items and price moves against the previous edition.</li><li><strong>Archive.</strong> Past editions stay navigable, so a decision can be traced to what was known that day.</li><li><strong>Golden Island lens.</strong> Each section opens with a one-line so-what for a product tanker owner-operator and physical fuel supplier, and flags items that name the company: methanol trials and the Yara ammonia agreement.</li></ul></div>'+
  '<h3 style="margin-bottom:8px">Coverage in the latest edition</h3><div class="tablewrap cov" style="margin-bottom:22px"><table><thead><tr><th>Section</th><th>Items</th><th>Cross-checked</th></tr></thead><tbody>'+covRows+'</tbody></table></div>'+
  '<div class="card"><h3>Limits management should know</h3><ul class="plain"><li>Prices come from open sources and are not a live Platts or Argus feed. For trading or contract pricing, use licensed data.</li><li>The latest edition is 2 Nov 2026, the newest the existing desk had saved. Nothing for 3–4 Nov was available.</li><li>The added alternative-fuel sections are newer-researched only to Oct 2026 at best, and several products have no verified 2026 price: methanol, ethanol, ammonia, B24, B100 and gasoil.</li><li>Many daily-desk prices are carried-forward quotes. Each shows its own timestamp.</li></ul></div>';
}

function render(){
  $("tabs").innerHTML=TABS.map(function(t){return '<button role="tab" aria-selected="'+(state.tab===t[0])+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("");
  $("edsel").innerHTML=EDITIONS.map(function(e,i){return '<option value="'+i+'"'+(i===state.ed?' selected':'')+'>'+e.date+'</option>'}).reverse().join("");
  $("prev").disabled=state.ed===0;$("next").disabled=state.ed===EDITIONS.length-1;
  var e=ed(),v={edition:viewEdition,prices:viewPrices,changes:viewChanges,archive:viewArchive,brief:viewBrief}[state.tab];
  $("view").innerHTML=v(e);
}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-tab]");if(t){go(t.getAttribute("data-tab"));return}
  var s=ev.target.closest("[data-sec]");if(s){ev.preventDefault();var el=$("sec-"+s.getAttribute("data-sec"));if(el)el.scrollIntoView({behavior:"smooth"})}
});
$("prev").onclick=function(){go("ed-"+EDITIONS[state.ed-1].date)};
$("next").onclick=function(){go("ed-"+EDITIONS[state.ed+1].date)};
$("edsel").onchange=function(){go("ed-"+EDITIONS[+this.value].date)};
window.addEventListener("hashchange",function(){parseHash();render()});
parseHash();render();
</script>
